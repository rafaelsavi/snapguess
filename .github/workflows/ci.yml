name: CI/CD Pipeline

on:
  push:
    branches: [ main, rc ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # STAGE 1: VALIDATE (Runs on EVERY PR and EVERY push to main)
  # ============================================================================
  validate:
    name: Validate (Format, Lint, Types, Tests & Version)
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_release.outputs.should_release }}
      version: ${{ steps.check_release.outputs.version }}
      tag: ${{ steps.check_release.outputs.tag }}
      is_official: ${{ steps.check_release.outputs.is_official }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies & Playwright browser
        run: |
          uv sync --extra dev
          uv run playwright install --with-deps chromium

      - name: Run Unified Verification Suite
        run: uv run python scripts/verify.py --ci

      - name: Evaluate Release Readiness
        id: check_release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          uv run python -c "
          import tomllib, os, re, subprocess
          from pathlib import Path

          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = f'v{version}'
          is_official = 'true' if re.match(r'^[0-9]+\.[0-9]+\.[0-9]+$', version) else 'false'

          # Check if tag already exists on remote origin
          result = subprocess.run(['git', 'ls-remote', '--tags', 'origin', f'refs/tags/{tag}'], capture_output=True, text=True)
          tag_exists = bool(result.stdout.strip())

          # Only release if tag does not exist yet on remote
          should_release = 'true' if not tag_exists else 'false'
          print(f'Version: {version}, Tag: {tag}, Remote Tag Exists: {tag_exists}, Should Release: {should_release}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\n')
              f.write(f'tag={tag}\n')
              f.write(f'is_official={is_official}\n')
              f.write(f'should_release={should_release}\n')
          "

  # ============================================================================
  # STAGE 1B: DOCKER SMOKE TEST (Runs on EVERY PR and push to main/rc)
  # ============================================================================
  docker-test:
    name: Docker Build & Permission Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: snapguess:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Unraid PUID/PGID, non-root --user, and permission diagnostics
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          trap 'docker rm -f sg-unraid sg-nonroot sg-denied >/dev/null 2>&1 || true; sudo rm -rf "$WORK_DIR"' EXIT

          # 1. Unraid simulation: root:root 0755 /app/data auto-fixed to 99:100 while read-only /photos stays untouched
          UNRAID_DATA="$WORK_DIR/unraid-data"
          UNRAID_PHOTOS="$WORK_DIR/unraid-photos"
          sudo mkdir -p "$UNRAID_DATA" "$UNRAID_PHOTOS"
          sudo chown 0:0 "$UNRAID_DATA" "$UNRAID_PHOTOS"
          sudo chmod 0755 "$UNRAID_DATA" "$UNRAID_PHOTOS"

          docker run -d --name sg-unraid \
            -e PUID=99 -e PGID=100 \
            -e PHOTO_PROVIDER=local \
            -e LOCAL_LIBRARIES='{"Family":"/photos"}' \
            -v "$UNRAID_DATA:/app/data" \
            -v "$UNRAID_PHOTOS:/photos:ro" \
            -p 18011:8010 \
            snapguess:ci-test

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18011/api/health; then
              echo ""
              break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              docker logs sg-unraid || true
              exit 1
            fi
          done

          WORKER_UIDS="$(docker exec sg-unraid awk '/^Uid:/{u=$2; eu=$3} /^Gid:/{g=$2; eg=$3} END{print u":"eu":"g":"eg}' /proc/1/status)"
          test "$WORKER_UIDS" = "99:99:100:100"
          test "$(sudo stat -c '%u:%g' "$UNRAID_DATA")" = "99:100"
          test "$(sudo stat -c '%u:%g' "$UNRAID_DATA/metadata.db")" = "99:100"
          test "$(sudo stat -c '%u:%g' "$UNRAID_DATA/leaderboard.db")" = "99:100"
          test "$(sudo stat -c '%u:%g' "$UNRAID_PHOTOS")" = "0:0"
          docker rm -f sg-unraid

          # 2. Explicit --user 1000:1000 with properly owned pre-existing directory
          NONROOT_DATA="$WORK_DIR/nonroot-data"
          sudo mkdir -p "$NONROOT_DATA"
          sudo chown 1000:1000 "$NONROOT_DATA"
          sudo chmod 0755 "$NONROOT_DATA"

          docker run -d --name sg-nonroot \
            --user 1000:1000 \
            -e PHOTO_PROVIDER=local \
            -e LOCAL_LIBRARIES='{"Family":"/photos"}' \
            -v "$NONROOT_DATA:/app/data" \
            -v "$UNRAID_PHOTOS:/photos:ro" \
            -p 18012:8010 \
            snapguess:ci-test

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18012/api/health; then
              echo ""
              break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              docker logs sg-nonroot || true
              exit 1
            fi
          done
          docker rm -f sg-nonroot

          # 3. Forced --user 1000:1000 against root:root 0755 must fail cleanly with actionable guidance
          DENIED_DATA="$WORK_DIR/denied-data"
          sudo mkdir -p "$DENIED_DATA"
          sudo chown 0:0 "$DENIED_DATA"
          sudo chmod 0755 "$DENIED_DATA"

          set +e
          docker run --name sg-denied \
            --user 1000:1000 \
            -e PHOTO_PROVIDER=local \
            -e LOCAL_LIBRARIES='{"Family":"/photos"}' \
            -v "$DENIED_DATA:/app/data" \
            -v "$UNRAID_PHOTOS:/photos:ro" \
            snapguess:ci-test > "$WORK_DIR/denied.log" 2>&1
          STATUS=$?
          set -e
          cat "$WORK_DIR/denied.log"
          test "$STATUS" -ne 0
          grep -q "PUID/PGID" "$WORK_DIR/denied.log"

  # ============================================================================
  # STAGE 2: RELEASE (Runs ONLY if validate succeeded, on main, and version is new)
  # ============================================================================
  release:
    name: Create Tag & GitHub Release
    needs: [validate, docker-test]
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 -c "
          import re, os
          from pathlib import Path
          content = Path('CHANGELOG.md').read_text(encoding='utf-8')
          version = os.environ['VERSION']
          pattern = rf'##\s*\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else ''
          Path('release_notes.md').write_text(notes, encoding='utf-8')
          "
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Create Git Tag
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG" || echo "::warning::Direct git push failed; tag will be created by action-gh-release."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.validate.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ needs.validate.outputs.is_official == 'false' }}
          make_latest: ${{ needs.validate.outputs.is_official == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 3: DOCKER (Runs ONLY if release succeeded)
  # ============================================================================
  docker:
    name: Build & Publish Multi-Arch Docker
    needs: [validate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ needs.validate.outputs.is_official == 'true' }}
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=rc,enable=${{ needs.validate.outputs.is_official == 'false' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
