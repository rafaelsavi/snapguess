services:
  snapguess:
    image: ghcr.io/rafaelsavi/snapguess:latest
    container_name: snapguess
    restart: unless-stopped
    # Non-root user execution (UID:GID 1000:1000) for security hardening
    user: "1000:1000"
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      # Persistent SQLite data directory (metadata.db, leaderboard.db)
      - ./data:/app/data
      # When PHOTO_PROVIDER=local: Mount local photo directories as read-only volumes
      # - /path/to/my/photos:/photos:ro
    networks:
      - snapguess-net
    # Security: Do NOT mount /var/run/docker.sock
    # Cloudflare Tunnel: Connect cloudflared to snapguess-net or route to http://snapguess:8010

networks:
  snapguess-net:
    driver: bridge
