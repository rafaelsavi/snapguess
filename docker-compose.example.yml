services:
  snapguess:
    image: ghcr.io/rafaelsavi/snapguess:latest
    container_name: snapguess
    restart: unless-stopped
    # Entrypoint prepares ./data ownership and drops privileges to PUID:PGID before launching the app.
    # Optional: Uncomment `user: "1000:1000"` if ./data is pre-created with matching ownership for zero-root startup.
    # user: "1000:1000"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      # Persistent SQLite data directory (metadata.db, leaderboard.db)
      - ./data:/app/data
      # When PHOTO_PROVIDER=local: Mount local photo directories as read-only volumes
      # - /path/to/my/photos:/photos:ro
    networks:
      - snapguess-net
    # Security: Do NOT mount /var/run/docker.sock
    # Cloudflare Tunnel: Connect cloudflared to snapguess-net or route to http://snapguess:8010

networks:
  snapguess-net:
    driver: bridge
